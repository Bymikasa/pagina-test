<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en MiProyecto.">
    <title>Acceder | MiProyecto</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f1f5f9;
            background: #0a0d14;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.22), transparent 42%),
                #0a0d14;
        }

        .card {
            width: min(100%, 420px);
            padding: 36px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 24px;
            background: rgba(18, 24, 36, 0.92);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 34px;
            color: #fff;
            font-size: 18px;
            font-weight: 750;
            letter-spacing: -0.03em;
        }

        .brand-mark {
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            border-radius: 13px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            font-size: 15px;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: 29px;
            letter-spacing: -0.045em;
        }

        .intro {
            margin: 9px 0 27px;
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 23px;
            padding: 4px;
            border-radius: 11px;
            background: #0d121c;
        }

        .tabs button {
            min-height: 39px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #9ca3af;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .tabs button[aria-selected="true"] {
            background: #222b3c;
            color: #fff;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #d1d5db;
            font-size: 13px;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #374151;
            border-radius: 10px;
            outline: none;
            background: #0d121c;
            color: #f8fafc;
            font: inherit;
            font-size: 14px;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
        }

        .submit {
            width: 100%;
            min-height: 47px;
            margin-top: 5px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(100deg, #6366f1, #9333ea);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
        }

        .submit:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .submit:focus-visible,
        .tabs button:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 2px;
        }

        .message {
            margin: 15px 0 0;
            padding: 12px;
            border: 1px solid #7f1d1d;
            border-radius: 10px;
            background: #2a1419;
            color: #fecaca;
            font-size: 12px;
            line-height: 1.55;
        }

        [hidden] {
            display: none !important;
        }

        .footnote {
            margin: 21px 0 0;
            color: #6b7280;
            font-size: 11px;
            line-height: 1.55;
            text-align: center;
        }

        @media (max-width: 440px) {
            .card {
                padding: 27px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">MP</span>
            <span>MiProyecto</span>
        </div>

        <h1 id="formTitle">Bienvenido de nuevo</h1>
        <p class="intro">Inicia sesión para continuar a la página principal.</p>

        <div class="tabs" role="tablist" aria-label="Tipo de acceso">
            <button id="loginTab" type="button" role="tab" aria-selected="true" aria-controls="authForm">Iniciar sesión</button>
            <button id="registerTab" type="button" role="tab" aria-selected="false" aria-controls="authForm">Crear cuenta</button>
        </div>

        <form id="authForm">
            <div class="field" id="nameField" hidden>
                <label for="displayName">Nombre</label>
                <input id="displayName" type="text" autocomplete="name" maxlength="80" placeholder="Tu nombre">
            </div>

            <div class="field">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" autocomplete="username" required maxlength="254" placeholder="tu@ejemplo.test">
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="Al menos 8 caracteres">
            </div>

            <div class="field" id="confirmField" hidden>
                <label for="confirmPassword">Repite la contraseña</label>
                <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Escribe la misma contraseña">
            </div>

            <button id="submitButton" class="submit" type="submit">Iniciar sesión</button>
            <p id="formMessage" class="message" role="alert" hidden></p>
        </form>

        <p class="footnote">Práctica local: usa solo cuentas y contraseñas ficticias.</p>
    </main>

    <script>
        let mode = 'login';

        function setMode(nextMode) {
            mode = nextMode;
            const registering = mode === 'register';
            document.getElementById('loginTab').setAttribute('aria-selected', String(!registering));
            document.getElementById('registerTab').setAttribute('aria-selected', String(registering));
            document.getElementById('formTitle').textContent = registering ? 'Crea una cuenta' : 'Bienvenido de nuevo';
            document.getElementById('nameField').hidden = !registering;
            document.getElementById('displayName').required = registering;
            document.getElementById('confirmField').hidden = !registering;
            document.getElementById('confirmPassword').required = registering;
            document.getElementById('password').autocomplete = registering ? 'new-password' : 'current-password';
            document.getElementById('submitButton').textContent = registering ? 'Crear cuenta' : 'Iniciar sesión';
            document.getElementById('formMessage').hidden = true;
        }

        document.getElementById('loginTab').addEventListener('click', () => setMode('login'));
        document.getElementById('registerTab').addEventListener('click', () => setMode('register'));

        document.getElementById('authForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const submitButton = document.getElementById('submitButton');
            const message = document.getElementById('formMessage');
            submitButton.disabled = true;
            message.hidden = true;

            const password = document.getElementById('password').value;
            const registering = mode === 'register';
            if (registering && password !== document.getElementById('confirmPassword').value) {
                message.textContent = 'Las contraseñas no coinciden.';
                message.hidden = false;
                submitButton.disabled = false;
                return;
            }

            const payload = {
                email: document.getElementById('email').value,
                password
            };
            const endpoint = registering ? '/api/register' : '/api/login';
            if (registering) {
                payload.displayName = document.getElementById('displayName').value;
                payload.confirmPassword = document.getElementById('confirmPassword').value;
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || 'No se pudo completar el acceso.');
                }
                window.location.replace('/welcome');
            } catch (error) {
                message.textContent = error instanceof TypeError
                    ? 'No se pudo conectar con el servidor local. Comprueba que esté encendido.'
                    : error.message;
                message.hidden = false;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
